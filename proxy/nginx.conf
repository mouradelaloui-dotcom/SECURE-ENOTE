worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  server_tokens off;                       # ne pas divulguer la version
  client_max_body_size 1m;
  sendfile on;
  keepalive_timeout 30;

  # Limitation de débit sur l'authentification (anti force brute, en complément de l'application)
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

  upstream enote { server app:3000; keepalive 16; }

  server {
    listen 80;
    return 301 https://$host:8443$request_uri;   # HTTP -> HTTPS
  }

  server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location = /api/auth/demo-code { proxy_pass http://enote; }   # mode démonstration (rafraîchi chaque seconde)
    location /api/auth/ { limit_req zone=auth burst=10 nodelay; limit_req_status 429; proxy_pass http://enote; }
    location /api/      { limit_req zone=api burst=40 nodelay; limit_req_status 429; proxy_pass http://enote; }
    location /          { proxy_pass http://enote; }
  }
}
