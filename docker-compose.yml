# SECURE-eNOTE — déploiement Docker
#   1) docker compose up -d --build
#   2) ouvrir https://localhost:8443  (certificat auto-signé : accepter l'avertissement du navigateur)
name: secure-enote

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: enote
      POSTGRES_USER: enote_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/db_owner_password
      APP_DB_PASSWORD_FILE: /run/secrets/db_app_password
      TZ: Africa/Casablanca
    secrets: [db_owner_password, db_app_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [backend]            # base de données jamais exposée hors du réseau interne
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enote_owner -d enote"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: ./app
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: enote
      PGUSER: enote_app
      PGPASSWORD_FILE: /run/secrets/db_app_password
      MIGRATION_USER: enote_owner
      MIGRATION_PASSWORD_FILE: /run/secrets/db_owner_password
      ENOTE_MASTER_KEY_FILE: /run/secrets/enote_master_key
      PUBLIC_HTTPS: "true"
      TRUST_PROXY: "true"
      DEMO_MODE: "${DEMO_MODE:-true}"       # affiche le code TOTP attendu (démonstration au jury) — false en production
      DEMO_DATA: "${DEMO_DATA:-true}"       # jeu de données fictif — false en production (base vide, puis creer-admin et importer)
      BACKUP_INTERVAL_HOURS: "4"
      BACKUP_RETENTION: "30"
    secrets: [db_owner_password, db_app_password, enote_master_key]
    volumes:
      - backups:/backups
    networks: [backend, frontend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  proxy:
    build: ./proxy
    restart: unless-stopped
    depends_on:
      app: { condition: service_healthy }
    ports:
      - "8443:443"
      - "8080:80"
    volumes:
      - certs:/etc/nginx/certs
    networks: [frontend]
    security_opt: ["no-new-privileges:true"]

secrets:
  db_owner_password: { file: ./secrets/db_owner_password.txt }
  db_app_password: { file: ./secrets/db_app_password.txt }
  enote_master_key: { file: ./secrets/enote_master_key.txt }

volumes:
  pgdata:
  backups:
  certs:

networks:
  backend: { internal: true }
  frontend:
